[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paperdesk"
version = "1.0.0"
description = "A local research library with evidence-grounded STORM-style paper reviews"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
  "pypdf>=6,<7",
  "openai>=2,<3",
  "platformdirs>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5"]
build = ["pyinstaller>=6.16,<7"]

[project.gui-scripts]
paperdesk = "paperdesk.__main__:main"

[tool.setuptools.packages.find]
include = ["paperdesk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
